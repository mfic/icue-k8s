services:
  devserver:
    image: nginx:alpine
    ports:
      - "8888:80"
    volumes:
      - ./src:/usr/share/nginx/html:ro
      - ../icue-widgetbuilder/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ~/.kube:/root/.kube:ro
    environment:
      KUBECONFIG: /root/.kube/config
    restart: unless-stopped
